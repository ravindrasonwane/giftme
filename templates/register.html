<!DOCTYPE html>
<html>
<head>
    <title>Register - ApplyAI</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: white;
            display: flex;
            height: 100vh;
        }

        /* LEFT SIDE */
        .left {
            flex: 1;
            background: linear-gradient(135deg, #7c3aed, #22c55e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
        }

        /* RIGHT SIDE */
        .right {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 16px;
            width: 320px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            background: #1a1a1a;
            color: white;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #7c3aed;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            margin-top: 10px;
            cursor: pointer;
        }

        button:hover {
            background: #6d28d9;
        }

        .link {
            text-align: center;
            margin-top: 15px;
            color: #aaa;
        }

        .link a {
            color: #7c3aed;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="left">
        ApplyAI 🚀
    </div>

    <div class="right">
        <div class="card">
            <h2>Create Account</h2>

            <form method="POST">
                <input type="text" name="name" placeholder="Full Name" required>
                <input type="email" name="email" placeholder="Email" required>
                <input type="text" name="mobile" placeholder="Mobile Number" required>
                <input type="password" name="password" placeholder="Password" required>

                <button type="submit">Register</button>
            </form>

            <div class="link">
                Already have an account? <a href="/login">Login</a>
            </div>
        </div>
    </div>

</body>
</html>
